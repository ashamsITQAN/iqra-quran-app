name: Fetch the Quran Lab SDK skill
# Saves Quran Lab's skill file in the repository byte for byte, checked against the SHA-256 its manifest gives.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/quranlab-skill.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          set -e
          base=https://sdk.quranlab.ai/skills/quranlab-sdk
          mkdir -p .claude/skills/quranlab-sdk
          curl -fsSL "$base/manifest.json" -o /tmp/manifest.json
          url=$(python3 -c 'import json;m=json.load(open("/tmp/manifest.json"));print([f for f in m["files"] if f["path"].endswith("SKILL.md")][0]["url"])')
          sha=$(python3 -c 'import json;m=json.load(open("/tmp/manifest.json"));print([f for f in m["files"] if f["path"].endswith("SKILL.md")][0]["sha256"].lower())')
          case "$url" in https://sdk.quranlab.ai/*) ;; *) echo "unexpected address"; exit 1;; esac
          curl -fsSL "$url" -o /tmp/SKILL.md
          echo "$sha  /tmp/SKILL.md" | sha256sum -c -
          cp /tmp/SKILL.md .claude/skills/quranlab-sdk/SKILL.md
          head -c 400 .claude/skills/quranlab-sdk/SKILL.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills/quranlab-sdk/SKILL.md
          git diff --cached --quiet || git commit -m "Quran Lab SDK skill, as published"
          git push

name: Build and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"   # daily 04:17 Riyadh: pick up text corrections made in Fanar
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/fetch-pages.sh
      - name: Install Fanar assets with itqan-cli
        env:
          ITQAN_API_KEY: ${{ secrets.ITQAN_API_KEY }}
          ITQAN_NO_UPDATE_NOTICE: "1"
        run: |
          pipx install itqan-cli
          itqan install
          python3 scripts/fanar.py fanar-assets public
      - name: Similar phrases (QUL mutashabihat export)
        run: |
          curl -fsSL --retry 3 "https://s3.us-east-1.wasabisys.com/static-cdn.tarteel.ai/qul-exports/mutashabihat/1722613172-vnm9h-mutashabihat.zip" -o /tmp/mutashabihat.zip \
            && python3 scripts/mutashabihat.py /tmp/mutashabihat.zip public \
            || echo "::warning::mutashabihat export not available; the app is built without it"
      # The index of words the readings differ on takes one request per ayah. It is kept between builds, and each build
      # spends at most five minutes reading the ayahs it still lacks.
      - uses: actions/cache@v4
        with:
          path: qiraat-index.json
          key: qiraat-index-${{ github.run_id }}
          restore-keys: qiraat-index-
      - name: Readings index (Surah API)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          python3 scripts/qiraat.py public qiraat-index.json 5 || true
          if [ -f qiraat-index.json ]; then cp qiraat-index.json public/data/qiraat.json; else echo "::warning::readings index not built; the app reads the readings live"; fi
      - name: Stamp the build version
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::10}/" public/index.html public/sw.js
          echo "{\"v\":\"${GITHUB_SHA::10}\"}" > public/version.json
          du -sh public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Build and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/fetch-pages.sh
      - name: Install Fanar assets with itqan-cli
        env:
          ITQAN_API_KEY: ${{ secrets.ITQAN_API_KEY }}
          ITQAN_NO_UPDATE_NOTICE: "1"
        run: |
          pipx install itqan-cli
          itqan install
          python3 scripts/fanar.py fanar-assets public
      - name: Stamp the build version
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::10}/" public/index.html
          echo "{\"v\":\"${GITHUB_SHA::10}\"}" > public/version.json
          du -sh public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

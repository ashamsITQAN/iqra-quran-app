<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اقرأ القرآن الكريم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-screen reader. Slim bar, the printed page (or a two-page spread) fills the stage,
   a pager at the bottom, and a sheet that slides in with the projects of whatever was tapped. */
:root{
  --bg:#e4ebe8; --paper:#fbfcf8; --ink:#1b2321; --muted:#5d6b67; --line:#cfd9d5;
  --accent:#0d6858; --mark:#a17a22; --tint:rgba(13,104,88,.13); --tint-strong:rgba(13,104,88,.24);
  --panel:#ffffff; --banner:rgba(161,122,34,.10);
  --ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --naskh:"Noto Naskh Arabic","Traditional Arabic",serif;
  --quran:"Amiri Quran","Noto Naskh Arabic",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1413; --paper:#171f1d; --ink:#e7ece8; --muted:#9aa9a4; --line:#2b3835;
    --accent:#62cdb6; --mark:#d3b067; --tint:rgba(98,205,182,.16); --tint-strong:rgba(98,205,182,.30);
    --panel:#1c2624; --banner:rgba(211,176,103,.12); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1413; --paper:#171f1d; --ink:#e7ece8; --muted:#9aa9a4; --line:#2b3835;
  --accent:#62cdb6; --mark:#d3b067; --tint:rgba(98,205,182,.16); --tint-strong:rgba(98,205,182,.30);
  --panel:#1c2624; --banner:rgba(211,176,103,.12); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.bar{min-width:0}
.bar h1{font-size:17px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:640px){.bar .chip{display:none}.bar h1{font-size:15px}.bar select{max-width:34vw}.bar{gap:6px;padding-inline:10px}}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.bar .grow{flex:1}
.bar select{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:46vw}

#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 16px;overflow:auto;touch-action:pan-y}
#spread{display:flex;gap:6px;align-items:flex-start;justify-content:center;margin:auto}
.page{background:var(--paper);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;flex:none;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.page.blank{visibility:hidden}
.head{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-family:var(--naskh);font-size:14px;color:var(--muted);flex:none}
.head button,.foot button{background:none;border:0;padding:4px 8px;border-radius:6px;color:inherit}
.head button:hover,.foot button:hover{background:var(--tint)}
.art{position:relative;border-block:1px solid var(--mark);margin-inline:6px;outline:1px solid var(--line);outline-offset:2px}
.art svg{display:block;width:100%;height:100%}
.art .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.foot{height:38px;display:grid;place-items:center;flex:none}
.foot button{font-family:var(--naskh);font-size:16px;min-width:48px;color:var(--ink);border:1px solid var(--line)}
.page.sel .foot button,.head button.sel{background:var(--tint-strong);border-color:var(--accent);color:var(--accent)}

/* the page artwork */
.art svg path{fill:var(--ink)}
.art svg path[data-kind="ayah_mark_ornament"]{fill:var(--mark)}
.art svg .hit{fill:transparent;pointer-events:all;cursor:pointer}
.art svg .banner{fill:var(--banner);stroke:var(--mark);stroke-width:.5;pointer-events:all;cursor:pointer}
.art svg g.surah-name{cursor:pointer}
@media (hover:hover){
  .art svg g.word:hover .hit,.art svg g.ayah-mark:hover .hit{fill:var(--tint)}
  .art svg .banner:hover{fill:var(--tint)}
}
.art svg g.ayah-fragment.sel g.word .hit{fill:var(--tint)}
.art svg g.ayah-mark.sel .hit{fill:var(--tint-strong)}
.art svg g.word.sel .hit{fill:var(--tint-strong)}
.art svg g.word.sel path{fill:var(--accent)}
.art svg .banner.sel{fill:var(--tint-strong);stroke:var(--accent)}

.btn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;flex:none}
#find{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;padding:12px 16px;gap:8px}
#find[hidden]{display:none}
.find-top{display:flex;gap:8px;max-width:760px;width:100%;margin-inline:auto}
#q{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:17px;font-family:var(--naskh)}
#find .note{max-width:760px;width:100%;margin-inline:auto}
#results{list-style:none;margin:0 auto;padding:0;overflow:auto;flex:1;max-width:760px;width:100%;display:flex;flex-direction:column;gap:8px}
#results button{display:block;width:100%;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
#results button:hover{border-color:var(--accent)}
#results .where{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
#results .ay{font-family:var(--naskh);font-size:18px;line-height:2}
#results mark{background:var(--tint-strong);color:var(--accent);border-radius:3px;padding:0 1px}
#results .near{font-size:11px;color:var(--mark);border:1px solid var(--mark);border-radius:999px;padding:0 8px;margin-inline-start:6px}
.art svg g.word.found .hit{fill:var(--tint-strong)}
.art svg g.word.found path{fill:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{background:var(--paper);border:0;padding:6px 10px;font-size:13px;white-space:nowrap}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.seg button{padding:7px 14px}
.pm{color:var(--muted);font-size:.62em;font-family:var(--ui);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.ref{background:none;border:0;padding:0 1px;color:var(--accent);font-family:var(--ui);font-size:.62em;vertical-align:super;line-height:1}
.notes{margin:10px 0 4px;padding:8px 22px 0 0;border-top:1px solid var(--line);font-family:var(--naskh);font-size:14px;line-height:1.9;color:var(--muted);list-style:arabic-indic}
.notes li{padding-inline-start:4px;border-radius:4px;transition:background .3s}
.notes li.hot{background:var(--tint-strong);color:var(--ink)}
.more{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:12px;margin-top:6px;color:var(--accent)}
.pager{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);flex:none}
.pager button{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 14px;white-space:nowrap}
.pager button:disabled{opacity:.4;cursor:default}
.pager input{flex:1;min-width:0;accent-color:var(--accent)}
.pager output{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;min-width:5.5em;text-align:center}

#veil{position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.38)}
#veil[hidden]{display:none}
.modal{position:fixed;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 24px));max-height:min(84%,780px);
  background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);display:none;flex-direction:column}
.modal.open{display:flex}
#settings{width:min(480px,calc(100% - 24px))}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0}
.opt.col{flex-direction:column;align-items:stretch}
.opt h3{margin:0;font-size:14px;font-weight:600}
#set-projects{display:flex;flex-direction:column;gap:2px}
#set-projects h4{margin:10px 0 2px;font-size:12px;font-weight:500;color:var(--muted)}
#set-projects label{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:6px;font-size:14px;cursor:pointer}
#set-projects label:hover{background:var(--tint)}
#set-projects input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;border-bottom:1px solid var(--line);flex:none;scrollbar-width:thin}
.tabs button{white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-size:13.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.proj.solo{border:0;background:none;padding:6px 0}
.ayah-block{background:var(--paper);border:1px solid var(--line);border-inline-start:3px solid var(--mark);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:center;flex:none;width:100%;max-width:500px;margin-inline:auto;max-height:46vh;overflow-x:hidden;overflow-y:auto}
.ayah-block svg{flex:none}
.ayah-block svg{display:block;height:auto;max-width:100%}
.ayah-block svg path{fill:var(--ink)}
.ayah-block .hit{fill:transparent;pointer-events:none}
.ayah-block.pick .hit{pointer-events:all;cursor:pointer}
.ayah-block g.word.sel .hit{fill:var(--tint-strong)}
.ayah-block g.word.sel path{fill:var(--accent)}
@media (hover:hover){.ayah-block.pick g.word:hover .hit{fill:var(--tint)}}
.tabs[hidden],.subtabs[hidden]{display:none}
#index{width:min(520px,calc(100% - 24px));height:min(84%,780px)}
.pagejump{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex:none}
.pagejump input{width:64px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
.idx-list{list-style:none;margin:0;gap:4px}
.idx-list button{display:grid;grid-template-columns:2.4em 1fr auto;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;border-radius:8px;padding:8px 8px}
.idx-list button:hover,.idx-list button.here{background:var(--tint)}
.idx-list .n{font-variant-numeric:tabular-nums;color:var(--mark);font-family:var(--naskh);font-size:16px;text-align:center}
.idx-list .t{font-family:var(--naskh);font-size:18px}
.idx-list .t small{display:block;font-family:var(--ui);font-size:12px;color:var(--muted)}
.idx-list .pg{font-size:12px;color:var(--muted);white-space:nowrap}
.subtabs{display:flex;gap:6px;padding:8px 16px 0;flex-wrap:wrap;flex:none}
.subtabs button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-size:13px}
.subtabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:500}
.sh-nav{display:flex;justify-content:space-between;gap:8px;padding:8px 16px;border-top:1px solid var(--line);flex:none}
.sh-nav button{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:13px}
.ayah-block svg path[data-kind="ayah_mark_ornament"]{fill:var(--mark)}
.sh-top{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 8px}
.sh-title{flex:1;min-width:0}
.sh-title .big{font-family:var(--quran);font-size:30px;line-height:1.9;margin:0}
.sh-title .big.plain{font-family:var(--ui);font-size:18px;font-weight:600;line-height:1.5}
.sh-title .sub{color:var(--muted);font-size:13px;margin:0}
.sh-close{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;flex:none;font-size:18px;line-height:1}
.levels{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.levels button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:13px}
.levels button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:500}
.sh-body{overflow:auto;padding:10px 16px 18px;display:flex;flex-direction:column;gap:10px}
.proj{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.proj.empty{border-style:dashed;background:none}
.proj h3{margin:0 0 6px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:400;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.tag.src{color:var(--mark);border-color:var(--mark)}
.proj p{margin:0;color:var(--muted);font-size:13px}
.proj p.text{font-family:var(--naskh);font-size:18px;line-height:2;color:var(--ink);white-space:pre-line}
.proj dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.proj dt{color:var(--muted)}
.proj dd{margin:0;font-family:var(--naskh);font-size:16px}
.note{font-size:12px;color:var(--muted);margin:2px 0 0}
</style>
</head>
<body>
<header class="bar">
  <h1>اقرأ القرآن الكريم</h1>
  <span class="chip">نسخة تجريبية</span>
  <span class="grow"></span>
  <button type="button" id="find-open" class="btn">بحث</button>
  <button type="button" id="set-open" class="btn">الإعدادات</button>
  <button type="button" id="idx-open" class="btn">الفهرس</button>
</header>

<main id="stage"><div id="spread"></div></main>

<nav class="pager" aria-label="تقليب الصفحات">
  <button id="prev" type="button">السابقة</button>
  <input id="slider" type="range" min="1" max="604" step="1" value="1" aria-label="رقم الصفحة">
  <output id="where" for="slider"></output>
  <button id="next" type="button">التالية</button>
</nav>

<section id="find" role="dialog" aria-label="البحث في القرآن" hidden>
  <div class="find-top">
    <input id="q" type="search" placeholder="اكتب كلمة أو جزءًا من آية" autocomplete="off" aria-label="نص البحث">
    <button class="sh-close" id="find-close" type="button" aria-label="إغلاق البحث">×</button>
  </div>
  <p class="note" id="find-info">يتسامح البحث مع الهمزات والتاء المربوطة والألف المقصورة والأخطاء الإملائية القريبة.</p>
  <ol id="results"></ol>
</section>

<div id="veil" hidden></div>

<section id="settings" class="modal" role="dialog" aria-label="الإعدادات" aria-hidden="true">
  <div class="sh-top">
    <div class="sh-title"><p class="big plain">الإعدادات</p></div>
    <button class="sh-close" id="set-close" type="button" aria-label="إغلاق الإعدادات">×</button>
  </div>
  <div class="sh-body">
    <div class="opt"><h3>عرض الصفحات</h3>
      <div class="seg" id="seg-mode" role="group" aria-label="عدد الصفحات المعروضة">
        <button type="button" data-v="auto">تلقائي</button><button type="button" data-v="1">صفحة</button><button type="button" data-v="2">صفحتان</button>
      </div></div>
    <div class="opt"><h3>المظهر</h3>
      <div class="seg" id="seg-theme" role="group" aria-label="المظهر">
        <button type="button" data-v="auto">تلقائي</button><button type="button" data-v="light">نهاري</button><button type="button" data-v="dark">ليلي</button>
      </div></div>
    <div class="opt col"><h3>المحتوى المعروض</h3><div id="set-projects"></div></div>
  </div>
</section>

<section id="index" class="modal" role="dialog" aria-label="الفهرس" aria-hidden="true">
  <div class="sh-top">
    <div class="sh-title"><p class="big plain">الفهرس</p></div>
    <form id="idx-page" class="pagejump"><label for="idx-num">صفحة</label><input id="idx-num" type="number" inputmode="numeric" min="1" max="604"><button type="submit" class="btn">انتقال</button></form>
    <button class="sh-close" id="idx-close" type="button" aria-label="إغلاق الفهرس">×</button>
  </div>
  <div class="tabs" id="idx-tabs" role="tablist">
    <button type="button" role="tab" data-v="surah">السور</button><button type="button" role="tab" data-v="juz">الأجزاء</button><button type="button" role="tab" data-v="hizb">الأحزاب</button>
  </div>
  <ol class="sh-body idx-list" id="idx-list"></ol>
</section>

<section id="sheet" class="modal" role="dialog" aria-label="مشروعات المحتوى" aria-hidden="true">
  <div class="sh-top">
    <div class="sh-title"><p class="big" id="sh-big"></p><p class="sub" id="sh-sub"></p></div>
    <button class="sh-close" id="sh-close" type="button" aria-label="إغلاق">×</button>
  </div>
  <div class="levels" id="levels"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="subtabs" id="subtabs" role="tablist" hidden></div>
  <div class="sh-body" id="sh-body"></div>
  <div class="sh-nav"><button type="button" id="nav-prev">السابق</button><button type="button" id="nav-next">التالي</button></div>
</section>

<script>
(() => {
const RATIO = 345 / 550, FURN = 32 + 38 + 4;
const $ = (s, r = document) => r.querySelector(s);
const ar = (v) => String(v).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
const pad = (n) => String(n).padStart(3, "0");
const LEVELS = { word: "الكلمة", ayah: "الآية", surah: "السورة", page: "الصفحة" };

const store = { get(k, d) { try { const v = localStorage.getItem("iqra-" + k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem("iqra-" + k, v); } catch (e) {} } };
let mode = store.get("mode", "auto"), theme = store.get("theme", "auto");
let hidden = new Set(); try { hidden = new Set(JSON.parse(store.get("hidden", "[]"))); } catch (e) {}
const activeTab = {}, activeSub = {};
function applyTheme() { if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme); }
applyTheme();
let found = [];
let meta, projects, cur = 1, cols = 1, ctx = null, level = null, swiped = false;
const svgCache = new Map(), jsonCache = new Map();
const spread = $("#spread"), stage = $("#stage"), sheet = $("#sheet");

const getJSON = (url) => {
  if (!jsonCache.has(url)) jsonCache.set(url, fetch(url).then((r) => { if (!r.ok) throw new Error(url); return r.json(); }));
  return jsonCache.get(url);
};
const getSVG = (n) => {
  if (!svgCache.has(n)) svgCache.set(n, fetch(`pages/${pad(n)}.svg`).then((r) => { if (!r.ok) throw new Error("page " + n); return r.text(); }));
  return svgCache.get(n);
};
const pageMeta = (n) => meta.pages.find((p) => p.page === n);
const surahName = (s) => "سورة " + meta.surahs[s].name;

/* ---------- layout: one page on a phone, two on a tablet or desktop ---------- */
function measure() {
  const w = stage.clientWidth - 32, h = stage.clientHeight - 20;
  const two = Math.min(h - FURN, ((w - 6) / 2 - 14) / RATIO);
  const fitTwo = ((w - 6) / 2 - 14) / RATIO;
  if (mode === "2") return { cols: 2, artH: h - FURN >= 460 ? Math.min(fitTwo, h - FURN) : fitTwo };
  if (mode === "auto" && w >= 700 && two >= 500) return { cols: 2, artH: two };
  let one = (Math.min(w, 620) - 14) / RATIO;
  if (h - FURN >= 460) one = Math.min(one, h - FURN);
  return { cols: 1, artH: one };
}
function firstOfSpread(n) { return cols === 2 && n % 2 === 0 ? n - 1 : n; }

async function render() {
  const m = measure();
  cols = m.cols;
  cur = Math.max(meta.first, Math.min(meta.last, cur));
  const start = firstOfSpread(cur);
  const want = cols === 2 ? [start, start + 1] : [cur];
  spread.replaceChildren(...want.map((n) => pageShell(n, m.artH)));
  $("#slider").value = cur;
  $("#where").textContent = cols === 2 && start + 1 <= meta.last ? `${ar(start)}–${ar(start + 1)} من ${ar(meta.last)}` : `${ar(cur)} من ${ar(meta.last)}`;
  $("#prev").disabled = start <= meta.first;
  $("#next").disabled = want[want.length - 1] >= meta.last;
  try { history.replaceState(null, "", "#p" + cur); } catch (e) {}
  await Promise.all(want.filter((n) => n <= meta.last).map(fillPage));
  applySelection();

/* Add invisible touch targets and the surah banner. The printed ink is never moved or redrawn. */
function decorate(svg) {
  const NS = "http://www.w3.org/2000/svg";
  const rect = (b, padX, padY, cls) => {
    const r = document.createElementNS(NS, "rect");
    r.setAttribute("x", b.x - padX); r.setAttribute("y", b.y - padY);
    r.setAttribute("width", b.width + 2 * padX); r.setAttribute("height", b.height + 2 * padY);
    r.setAttribute("class", cls);
    return r;
  };
  const content = svg.querySelector("#content"), markers = svg.querySelector("#ayah_markers");
  const cb = content.getBBox();
  svg.querySelectorAll("g.surah-name").forEach((g) => {
    const frame = g.parentNode, t = /translate\(\s*([-\d.]+)[\s,]+([-\d.]+)/.exec(frame.getAttribute("transform") || "");
    const nb = g.getBBox();
    const full = { x: cb.x - (t ? +t[1] : 0), y: nb.y, width: cb.width, height: nb.height };
    const r = rect(t ? full : nb, 0, 3.2, "banner");
    r.setAttribute("rx", 2.5); r.dataset.sid = g.dataset.sid;
    frame.insertBefore(r, g);
  });
  svg.querySelectorAll("g.word").forEach((g) => g.insertBefore(rect(g.getBBox(), 1, 0.6, "hit"), g.firstChild));
  if (markers) {
    markers.querySelectorAll("g.ayah-mark").forEach((g) => g.appendChild(rect(g.getBBox(), 1.2, 1.2, "hit")));
    content.parentNode.appendChild(markers); // markers win the tap where a word's target touches them
  }
}

/* ---------- previous / next inside the window, at the level being shown ---------- */
async function step(dir) {
  if (!ctx || step.busy) return;
  step.busy = true;
  try {
    let page = ctx.page;
    if (level === "page") {
      page = ctx.page + dir;
      if (page < meta.first || page > meta.last) return;
      ctx = { page, surah: pageMeta(page).surahs[0], only: "page" };
    } else if (level === "surah") {
      const sn = ctx.surah + dir;
      if (!meta.surahs[sn]) return;
      page = meta.pages.find((p) => p.surahs.includes(sn)).page;
      ctx = { page, surah: sn, only: "surah" };
    } else {
      const rows = await loadCorpus();
      const [s0, a0] = ctx.ayah.split(":").map(Number);
      let i = rows.findIndex((r) => r.s === s0 && r.a === a0), w = level === "word" ? +ctx.word.split(":")[2] + dir : 1;
      if (level === "ayah" || w < 1 || w > rows[i].words.length) {
        i += dir;
        if (i < 0 || i >= rows.length) return;
        w = level === "word" && dir < 0 ? rows[i].words.length : 1;
      }
      const r = rows[i];
      page = r.page;
      ctx = { page, surah: r.s, ayah: `${r.s}:${r.a}` };
      if (level === "word") ctx.word = `${r.s}:${r.a}:${w}`;
    }
    if (!spread.querySelector(`.page[data-page="${page}"]`)) { cur = page; await render(); }
    if (level === "word") { const g = spread.querySelector(`g.word[data-word-key="${ctx.word}"]`); ctx.text = g ? g.dataset.rasmUthmani : ""; }
    await paintSheet();
    applySelection();
  } catch (e) { /* the index failed to load: stay where we are */ }
  finally { step.busy = false; }
}

/* The ayah exactly as printed: its ink is copied from the page, line by line. Each line keeps the size
   it has in the mushaf and is centred in the block. */
function ayahBlock(key, activeWord) {
  const frags = [...spread.querySelectorAll(`g.ayah-fragment[data-ayah-key="${key}"]`)].sort((a, b) => a.dataset.fragment - b.dataset.fragment);
  if (!frags.length) return null;
  const box = document.createElement("div");
  box.className = "ayah-block";
  box.setAttribute("role", "img");
  box.setAttribute("aria-label", "نص الآية برسم المصحف");
  const strip = (n) => {
    n.classList.remove("sel", "found"); n.querySelectorAll(".sel,.found").forEach((x) => x.classList.remove("sel", "found"));
    if (activeWord) n.querySelectorAll(`g.word[data-word-key="${activeWord}"]`).forEach((x) => x.classList.add("sel"));
    return n;
  };
  if (activeWord) {
    box.classList.add("pick");
    box.setAttribute("aria-label", "نص الآية برسم المصحف، المس كلمة لعرض محتواها");
    box.addEventListener("click", (e) => {
      const g = e.target.closest("g.word");
      if (!g || g.dataset.wordKey === ctx.word) return;
      ctx.word = g.dataset.wordKey; ctx.text = g.dataset.rasmUthmani;
      paintSheet(); applySelection();
    });
  }
  frags.forEach((f, i) => {
    const svg = f.ownerSVGElement, sr = svg.getBoundingClientRect(), cr = svg.querySelector("#content").getBoundingClientRect();
    if (!sr.width || !cr.width) return;
    const vbw = svg.viewBox.baseVal.width, k = vbw / sr.width, r = f.getBoundingClientRect();
    let L = r.left, T = r.top, R = r.right, B = r.bottom;
    const mk = i === frags.length - 1 ? svg.querySelector(`g.ayah-mark[data-ayah-key="${key}"]`) : null;
    if (mk) { const m = mk.getBoundingClientRect(); L = Math.min(L, m.left); T = Math.min(T, m.top); R = Math.max(R, m.right); B = Math.max(B, m.bottom); }
    const out = svg.cloneNode(false), pageG = svg.firstElementChild.cloneNode(false), lineG = f.parentNode.cloneNode(false);
    lineG.append(strip(f.cloneNode(true)));
    pageG.append(lineG);
    if (mk) pageG.append(strip(mk.cloneNode(true)));
    out.append(pageG);
    out.removeAttribute("style"); out.removeAttribute("role"); out.removeAttribute("aria-label"); out.setAttribute("aria-hidden", "true");
    out.setAttribute("viewBox", `${(L - sr.left) * k - 1} ${(T - sr.top) * k - 1} ${(R - L) * k + 2} ${(B - T) * k + 2}`);
    out.style.width = Math.min(100, ((R - L) / cr.width) * 100) + "%";
    box.append(out);
  });
  return box.children.length ? box : null;
}

async function card(p, key) {

  }

/* Publisher text is shown unchanged. Editorial footnotes arrive wrapped in ¬ … ¥: each becomes a numbered
   reference in the text and a numbered note under it. Print page markers (ج1 ص109) stay inline as a small tag. */
function richText(v, extraNotes) {
  const LIMIT = 700, PAGE_MARK = /^ج\s*\d+\s*ص\s*\d+$/;
  const p = document.createElement("p"), notes = document.createElement("ol"), wrap = document.createElement("div");
  p.className = "text"; p.dir = "auto"; notes.className = "notes";
  const fill = (str) => {
    p.replaceChildren(); notes.replaceChildren();
    let n = 0;
    str.split(/(¬[^¥]*¥?)/).forEach((part) => {
      if (!part) return;
      if (part[0] !== "¬") { p.append(part); return; }
      const body = part.replace(/^¬|¥$/g, "").trim();
      if (!body) return;
      if (PAGE_MARK.test(body)) { const m = document.createElement("span"); m.className = "pm"; m.textContent = ar(body); p.append(" ", m, " "); return; }
      n += 1;
      const li = document.createElement("li"), ref = document.createElement("button");
      li.textContent = body;
      ref.type = "button"; ref.className = "ref"; ref.textContent = "(" + ar(n) + ")"; ref.setAttribute("aria-label", "الهامش " + n);
      ref.addEventListener("click", () => { li.scrollIntoView({ block: "nearest" }); li.classList.add("hot"); setTimeout(() => li.classList.remove("hot"), 1500); });
      p.append(ref); notes.append(li);
    });
    (extraNotes || []).forEach((t) => { const li = document.createElement("li"); li.textContent = t; notes.append(li); });
    notes.hidden = !notes.children.length;
  };
  wrap.append(p);
  if (v.length > LIMIT) {
    let cut = v.lastIndexOf(" ", LIMIT); const open = v.lastIndexOf("¬", cut), shut = v.lastIndexOf("¥", cut);
    if (open > shut) cut = open;
    const short = v.slice(0, cut) + " …", b = document.createElement("button");
    fill(short);
    b.type = "button"; b.className = "more"; b.textContent = "عرض النص كاملًا";
    b.addEventListener("click", () => { fill(v); b.remove(); });
    wrap.append(b);
  } else fill(v);
  wrap.append(notes);
  return [wrap];
}

/* ---------- search: imla'i spelling in, place in the printed mushaf out ---------- */
const MARKS = /[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;
// Fold what people commonly mistype: hamza seats, alif forms, ta marbuta / ha, alif maqsura / ya.
const fold = (s) => s.replace(MARKS, "").replace(/[أإآٱ]/g, "ا").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/ء/g, "").replace(/ى/g, "ي").replace(/ة/g, "ه");
let corpus = null, vocab = null;
async function loadCorpus() {
  if (corpus) return corpus;
  const rows = await getJSON("data/search.json");
  vocab = new Set();
  corpus = rows.map(([s, a, page, words]) => {
    const norm = words.map((w) => fold(w));
    norm.forEach((w) => vocab.add(w));
    return { s, a, page, words, norm, line: " " + norm.join(" ") + " " };
  });
  vocab = [...vocab];
  return corpus;
}
// True when a and b differ by at most `max` single-letter edits (insert, delete, swap one for another).
function near(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return false;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const row = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (row[j] < best) best = row[j];
    }
    if (best > max) return false;
    prev = row;
  }
  return prev[b.length] <= max;
}
function search(query) {
  const qw = fold(query).split(/\s+/).filter(Boolean);
  if (!qw.length || qw.join("").length < 2) return { hits: [], fuzzy: false };
  const phrase = qw.join(" ");
  const pick = (row, test) => row.norm.map((w, i) => (test(w) ? i : -1)).filter((i) => i >= 0);
  // 1) the words as typed, in order, anywhere in the ayah (a typed word may be part of a longer one)
  let hits = corpus.filter((r) => r.line.includes(phrase)).map((r) => {
    const idx = [];
    for (let i = 0; i + qw.length <= r.norm.length; i++) {
      if (qw.every((w, k) => (qw.length === 1 ? r.norm[i + k].includes(w) : k === 0 ? r.norm[i + k].endsWith(w) : k === qw.length - 1 ? r.norm[i + k].startsWith(w) : r.norm[i + k] === w))) for (let k = 0; k < qw.length; k++) idx.push(i + k);
    }
    return { r, idx: [...new Set(idx)] };
  });
  if (hits.length) return { hits, fuzzy: false };
  // 2) every word present, in any order
  hits = corpus.filter((r) => qw.every((w) => r.line.includes(w))).map((r) => ({ r, idx: pick(r, (x) => qw.some((w) => x.includes(w))) }));
  if (hits.length) return { hits, fuzzy: false };
  // 3) spelling mistakes: each typed word may be one letter off (two for long words)
  const alts = qw.map((w) => (w.length < 3 ? [w] : vocab.filter((v) => near(w, v, w.length >= 7 ? 2 : 1))));
  if (alts.some((a) => !a.length)) return { hits: [], fuzzy: true };
  const sets = alts.map((a) => new Set(a));
  hits = corpus.filter((r) => sets.every((set) => r.norm.some((w) => set.has(w)))).map((r) => ({ r, idx: pick(r, (x) => sets.some((set) => set.has(x))) }));
  return { hits, fuzzy: true };
}
const findBox = $("#find"), qInput = $("#q"), resultsEl = $("#results"), findInfo = $("#find-info");
const HELP = findInfo.textContent, MAX = 150;
let findTimer;
async function runSearch() {
  const query = qInput.value.trim();
  if (!query) { resultsEl.replaceChildren(); findInfo.textContent = HELP; return; }
  try { await loadCorpus(); } catch (e) { findInfo.textContent = "تعذّر تحميل فهرس البحث. أعد المحاولة."; jsonCache.delete("data/search.json"); return; }
  if (qInput.value.trim() !== query) return;
  const { hits, fuzzy } = search(query);
  findInfo.textContent = !hits.length ? "لا توجد نتائج. جرّب كلمة أقل أو تهجئة أخرى."
    : `عدد الآيات: ${ar(hits.length)}${fuzzy ? "، بتهجئة قريبة مما كتبت" : ""}${hits.length > MAX ? `، المعروض أول ${ar(MAX)}` : ""}`;
  resultsEl.replaceChildren(...hits.slice(0, MAX).map(({ r, idx }) => {
    const li = document.createElement("li"), b = document.createElement("button"), where = document.createElement("span"), ay = document.createElement("span");
    b.type = "button"; where.className = "where"; ay.className = "ay";
    where.textContent = `${surahName(r.s)} · الآية ${ar(r.a)} · الصفحة ${ar(r.page)}`;
    if (fuzzy) { const t = document.createElement("span"); t.className = "near"; t.textContent = "تهجئة قريبة"; where.append(t); }
    const on = new Set(idx);
    r.words.forEach((w, i) => { if (on.has(i)) { const m = document.createElement("mark"); m.textContent = w; ay.append(m, " "); } else ay.append(w + " "); });
    b.append(where, ay);
    b.addEventListener("click", async () => {
      findBox.hidden = true;
      cur = r.page; ctx = null; show(sheet, false);
      found = idx.map((i) => `${r.s}:${r.a}:${i + 1}`);
      await render();
      const first = spread.querySelector("g.word.found");
      if (first) first.scrollIntoView({ block: "center", behavior: "smooth" });
    });
    li.append(b);
    return li;
  }));
  resultsEl.scrollTop = 0;
}
qInput.addEventListener("input", () => { clearTimeout(findTimer); findTimer = setTimeout(runSearch, 180); });
$("#find-open").addEventListener("click", () => { findBox.hidden = false; qInput.focus(); loadCorpus().catch(() => {}); });
$("#find-close").addEventListener("click", () => { findBox.hidden = true; });

let down = null;
stage.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; });
stage.addEventListener("pointerup", (e) => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 50) { swiped = true; setTimeout(() => { swiped = false; }, 50); go(dx > 0 ? 1 : -1); }
});
stage.addEventListener("pointercancel", () => { down = null; });

let rz;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const m = measure(); if (m.cols !== cols || Math.abs(m.artH - parseFloat(($(".art") || {}).style?.height || 0)) > 2) render(); }, 120); });
window.addEventListener("hashchange", () => { const n = +location.hash.replace("#p", ""); if (n && n !== cur) { cur = n; render(); } });

(async function init() {
  try { [meta, projects] = await Promise.all([getJSON("data/meta.json"), getJSON("data/projects.json")]); }
  catch (e) { spread.textContent = "تعذّر تحميل بيانات التطبيق. أعد تحميل الصفحة."; return; }
  $("#slider").min = meta.first; $("#slider").max = meta.last;
  $("#idx-num").max = meta.last;
  const h = +location.hash.replace("#p", "");
  if (h) cur = h;
  render();
})();
})();
